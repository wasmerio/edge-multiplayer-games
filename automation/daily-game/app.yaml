kind: wasmer.io/App.v0
name: multiplayer-game-cron
owner: wasmer
package: .
cli_args: [/app/health.py]
locality:
  regions: [fr-roub1]
env:
  GITHUB_REPOSITORY: wasmerio/edge-multiplayer-games
  OPENAI_MODEL: gpt-6-astra
  JS_COMMAND: /bin/node
jobs:
  - name: daily-game
    trigger: '0 6 * * *'
    action:
      execute:
        command: coordinator
        cli_args: [/app/cron.py]
        timeout: 50m
        retries: 0
